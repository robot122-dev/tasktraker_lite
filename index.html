<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTracker Lite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TaskTracker Lite</h1>
            <p class="subtitle">Управление задачами</p>
        </header>

        <section class="add-task">
            <h2>Добавить задачу</h2>
            <form id="taskForm">
                <input type="text" id="taskTitle" placeholder="Название задачи" required>
                <textarea id="taskDescription" placeholder="Описание задачи" rows="3"></textarea>
                <select id="taskPriority">
                    <option value="low">Низкий приоритет</option>
                    <option value="medium" selected>Средний приоритет</option>
                    <option value="high">Высокий приоритет</option>
                </select>
                <button type="submit" id="addTaskBtn">Добавить</button>
            </form>
        </section>

        <section class="filters">
            <h2>Фильтры</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="todo">К выполнению</button>
                <button class="filter-btn" data-filter="in_progress">В работе</button>
                <button class="filter-btn" data-filter="done">Выполнено</button>
            </div>
            <input type="text" id="searchInput" placeholder="Поиск задач...">
        </section>

        <section class="task-list">
            <h2>Список задач</h2>
            <div id="taskContainer">
                <p class="empty-message" id="emptyMessage">Задач пока нет. Добавьте первую задачу!</p>
            </div>
        </section>

        <footer>
            <p>TaskTracker Lite &copy; 2026 | Лабораторная работа №5</p>
        </footer>
    </div>

    <script src="js/tasks.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
